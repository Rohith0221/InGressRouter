name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        
      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Compile TypeScript
        run: npm run build

      - name: 5. Verify Docker Build
        run: docker build -t ingress-router:ci-test .